<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Smart Waste</title>

  <script>
    window.MAPS_KEY = "{{ google_maps_key }}";
  </script>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/map.css') }}">
</head>

<body>
  <div class="navbar">
    <h2>🚮 Smart Waste Dashboard</h2>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="content">
    <h3 id="roleTitle"></h3>

    <div class="map-container">
      <h4>📍 Bin Locations</h4>
      <div id="map"></div>
    </div>

    <div id="binSection" class="data-section">
      <h4>🗑️ Bin Status</h4>
      <div class="legend">
        <span class="legend-item bin-safe">Safe (&lt; 70%)</span>
        <span class="legend-item bin-warning">Warning (70–89%)</span>
        <span class="legend-item bin-full">Full (≥ 90%)</span>
      </div>
      <div id="binsContainer" class="card-container"></div>
    </div>

    <div id="alertSection" class="data-section">
      <h4>⚠️ Alerts</h4>
      <div id="alertsContainer" class="card-container"></div>
    </div>

    <div id="citizenSection" class="data-section">
      <h4>Nearby Bins</h4>
      <div id="citizenBinsContainer" class="card-container"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <audio id="alertSound" preload="auto"
    src="{{ url_for('static', filename='sounds/alert.mp3') }}"></audio>

  <button id="scrollTopBtn">↑</button>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
