<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Waste Management - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
  <div class="login-container">
    <h2>🚮 Smart Waste Management</h2>

    <!-- Step 1: Role Selection -->
    <div id="roleSelection">
      <button id="adminBtn">👨‍💼 Admin</button>
      <button id="citizenBtn">🧑‍🤝‍🧑 Citizen</button>
    </div>

    <!-- Step 2: Admin Login -->
    <form id="adminLoginForm" class="form-container" style="display:none;">
      <h3>Admin Login</h3>
      <input id="adminUsername" placeholder="Admin Username" required>
      <input type="password" id="adminPassword" placeholder="Password" required>
      <button type="submit">Login</button>
      <span class="backBtn">⬅ Back</span>
      <p id="adminMessage"></p>
    </form>

    <!-- Step 2: Citizen Login -->
    <form id="citizenLoginForm" class="form-container" style="display:none;">
      <h3>Citizen Login</h3>
      <input id="citizenUsername" placeholder="Username" required>
      <input type="password" id="citizenPassword" placeholder="Password" required>
      <button type="submit">Login</button>

      <p>New user? <span id="openRegister" class="link-btn">Register here</span></p>
      <span class="backBtn">⬅ Back</span>
      <p id="citizenMessage"></p>
    </form>

    <!-- Step 3: Registration -->
    <form id="registerForm" class="form-container" style="display:none;">
      <h3>Citizen Registration</h3>
      <input id="regUsername" placeholder="Create Username" required>
      <input type="password" id="regPassword" placeholder="Create Password" required>
      <input id="regPhone" placeholder="Phone Number" required>
      <button type="submit">Register</button>

      <span class="backBtn">⬅ Back</span>
      <p id="registerMessage"></p>
    </form>

    <!-- Step 4: OTP Verification -->
    <form id="otpForm" class="form-container" style="display:none;">
      <h3>Verify OTP</h3>
      <p style="font-size:14px;">Enter the OTP sent (displayed on screen)</p>
      <input id="otpInput" placeholder="6-digit OTP" required>
      <button type="submit">Verify</button>
      <p id="otpMessage"></p>
    </form>
  </div>

  <!-- Success Popup -->
  <div id="loginSuccess" class="success-popup">
    <div class="success-checkmark">
      <p>Login Successful!</p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
