<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Waste Management - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>
  <div class="login-container">
    <h2>🚮 Smart Waste Management</h2>

    <!-- Step 1: Role Selection -->
    <div id="roleSelection" class="role-selection">
      <button id="adminBtn">👨‍💼 I am Admin</button>
      <button id="citizenBtn">🧑‍🤝‍🧑 I am Citizen</button>
    </div>

    <!-- Step 2: Admin Login -->
    <form id="adminLoginForm" class="login-form" style="display:none;">
      <h3>Admin Login</h3>
      <input type="text" id="adminUsername" placeholder="Admin Username" required>
      <input type="password" id="adminPassword" placeholder="Password" required>
      <button type="submit">Login</button>
      <button type="button" class="backBtn">⬅ Back</button>
      <p id="adminMessage"></p>
    </form>

    <!-- Step 2: Citizen Login -->
    <form id="citizenLoginForm" class="login-form" style="display:none;">
      <h3>Citizen Login</h3>
      <input type="text" id="citizenUsername" placeholder="Username" required>
      <input type="password" id="citizenPassword" placeholder="Password" required>
      <button type="submit">Login</button>

      <p style="font-size:14px;">New user? 
         <span id="openRegister" class="link-btn">Register here</span>
      </p>
      <button type="button" class="backBtn">⬅ Back</button>
      <p id="citizenMessage"></p>
    </form>

    <!-- Step 3: Registration -->
    <form id="registerForm" class="login-form" style="display:none;">
      <h3>Citizen Registration</h3>
      <input type="text" id="regUsername" placeholder="Create Username" required>
      <input type="password" id="regPassword" placeholder="Create Password" required>
      <input type="text" id="regPhone" placeholder="Phone Number" required>
      <button type="submit">Register</button>

      <button type="button" class="backBtn">⬅ Back</button>
      <p id="registerMessage"></p>
    </form>

    <!-- Step 4: OTP Verification -->
    <form id="otpForm" class="login-form" style="display:none;">
      <h3>Enter OTP</h3>
      <input type="text" id="otpInput" placeholder="Enter Received OTP" required>
      <button type="submit">Verify OTP</button>
      <button type="button" class="backBtn">⬅ Back</button>
      <p id="otpMessage"></p>
    </form>
  </div>

  <!-- ✅ SUCCESS POPUP ANIMATION preserved -->
  <div id="loginSuccess" class="success-popup">
    <div class="success-checkmark">
      <div class="check-icon">
        <span class="icon-line line-tip"></span>
        <span class="icon-line line-long"></span>
        <div class="icon-circle"></div>
        <div class="icon-fix"></div>
      </div>
      <p>Login Successful!</p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
